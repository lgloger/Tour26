<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up – Tour26</title>
    <link
      rel="shortcut icon"
      href="assets/logo/tour26-favicon.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="styles/header.css" />
    <link rel="stylesheet" href="styles/index.css" />
    <link rel="stylesheet" href="styles/footer.css" />
    <script type="module" src="auth/authManger.js" defer></script>
  </head>
  <body>
    <header>
      <div class="headerMainCon">
        <div class="headerMainConMain">
          <a class="buttonCon blurEffect" href="index.html">
            <img
              src="assets/icons/tour26.svg"
              alt="Tour26"
              class="buttonConIcon"
            />
          </a>
          <div class="buttonListCon blurEffect">
            <span class="buttonConText">Tour26</span>
          </div>
        </div>
        <a
          class="buttonCon blurEffect"
          href="https://github.com/lgloger/Tour26-web/"
          title="Projekt auf GitHub"
        >
          <img
            src="assets/icons/github_w.svg"
            alt="Tour26"
            class="buttonConIcon"
          />
        </a>
      </div>
    </header>
    <main>
      <div class="firstMainSec">
        <span class="firstMainHeader">Neuen Tour26 Account erstellen</span>
        <input
          class="authenticationInput blurEffect"
          id="authenticationEmailInput"
          type="email"
          placeholder="E-Mail Adresse"
          required
        />
        <input
          class="authenticationInput blurEffect"
          id="authenticationPasswordInput"
          type="password"
          placeholder="Passwort"
          required
        />
        <button
          class="authenticationSubmitBtn blurEffect"
          id="authenticationSignUpBtn"
        >
          Account erstellen
        </button>
        <span class="authenticationText"
          >Oder mit bestehenden
          <a class="authenticationLink" href="index.html"
            >Account anmelden</a
          ></span
        >
      </div>
    </main>
    <footer>
      <div class="footerLinkListSec">
        <div class="footerLinkCon">
          <div class="footerlinkCategoryCon">
            <span class="footerLinkHeader">Noch mehr von @lucagloger</span>
            <a href="https://lucagloger.pages.dev/" class="footerLink"
              >lucagloger.pages.dev
              <img
                src="assets/icons/arrow.svg"
                alt="link"
                class="footerLinkIcon"
            /></a>
            <a href="https://tankradar.pages.dev/" class="footerLink"
              >tankradar.pages.dev
              <img
                src="assets/icons/arrow.svg"
                alt="link"
                class="footerLinkIcon"
            /></a>
          </div>
          <div class="footerlinkCategoryCon">
            <span class="footerLinkHeader">Intern</span>
            <a href="" class="footerLink">Mod Login</a>
          </div>
          <div class="footerlinkCategoryCon">
            <span class="footerLinkHeader">Rechtliches</span>
            <a href="impressum.html" class="footerLink">Impressum</a>
            <a href="datenschutz.html" class="footerLink">Datenschutz</a>
            <a href="urheberrecht.html" class="footerLink">Urheberrecht</a>
          </div>
        </div>
      </div>
      <div class="footerCopyrightSec">
        <span id="footerCopyrightText"
          >Copyright © <span id="copyrightYear"></span> Luca Gloger. Alle Rechte
          vorbehalten.</span
        >
        <div class="socialLinkCon">
          <a href="https://github.com/lgloger" class="socialLink">
            <img
              src="assets/icons/github.svg"
              alt="github"
              class="socialLinkIcon"
            />
          </a>
          <a href="https://x.com/luca_gloger" class="socialLink">
            <img
              src="assets/icons/twitter.svg"
              alt="twitter"
              class="socialLinkIcon"
            />
          </a>
          <a href="https://www.instagram.com/luca.gloger1/" class="socialLink">
            <img
              src="assets/icons/instagram.svg"
              alt="instagram"
              class="socialLinkIcon"
            />
          </a>
        </div>
      </div>
    </footer>
    <div class="firstOverlay"></div>
  </body>
  <script>
    document.getElementById("copyrightYear").textContent =
      new Date().getFullYear();
  </script>
</html>
