<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alle Touren – Tour26</title>
    <link
      rel="shortcut icon"
      href="assets/logo/tour26-favicon.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="styles/header.css" />
    <link rel="stylesheet" href="styles/touren.css" />
    <link rel="stylesheet" href="styles/footer.css" />
    <script type="module" src="auth/authManger.js" defer></script>
    <script type="module" src="scripts/listDataManger.js" defer></script>

  <body>
    <header>
      <div class="headerMainCon">
        <div class="headerMainConMain">
          <a class="buttonCon blurEffect" href="index.html">
            <img
              src="assets/icons/tour26.svg"
              alt="Tour26"
              class="buttonConIcon"
            />
          </a>
          <div class="buttonListCon blurEffect">
            <a class="buttonCon" href="" title="Touren" aria-label="Touren">
              <img
                src="assets/icons/bike.svg"
                alt="Touren"
                class="buttonConIcon"
              />
            </a>
            <button
              class="buttonCon"
              title="Ranking"
              aria-label="Ranking"
              id="infoBtn"
            >
              <img
                src="assets/icons/rank.svg"
                alt="Ranking"
                class="buttonConIcon"
              />
            </button>
          </div>
        </div>
        <button
          class="buttonCon blurEffect"
          title="Einstellungen"
          aria-label="Einstellungen"
        >
          <img
            src="assets/icons/profile.avif"
            alt="Profile"
            class="buttonConProfileIcon"
          />
        </button>
      </div>

    <main>
      <div class="firstMainSec">
        <span class="firstMainHeader"
          >Alle <span class="firstMainHeaderBrand">Touren</span></span
        >
      </div>
      <div id="mainSec">

      </div>

    <footer>
      <div class="footerLinkListSec">
        <div class="footerLinkCon">
          <div class="footerlinkCategoryCon">
            <span class="footerLinkHeader">Noch mehr von @lucagloger</span>
            <a href="https://lucagloger.pages.dev/" class="footerLink"
              >lucagloger.pages.dev
              <img
                src="assets/icons/arrow.svg"
                alt="link"
                class="footerLinkIcon"
            /></a>
            <a href="https://tankradar.pages.dev/" class="footerLink"
              >tankradar.pages.dev
              <img

                alt="link"

            /></a>
          </div>
          <div class="footerlinkCategoryCon">
            <span class="footerLinkHeader">Intern</span>
            <a href="" class="footerLink">Mod Login</a>
          </div>
          <div class="footerlinkCategoryCon">

            <a href="urheberrecht.html" class="footerLink">Urheberrecht</a>

        <span id="footerCopyrightText"
          >Copyright © <span id="copyrightYear"></span> Luca Gloger. Alle Rechte
          vorbehalten.</span
        >
        <div class="socialLinkCon">
          <a href="https://github.com/lgloger" class="socialLink">
            <img
              src="assets/icons/github.svg"
              alt="github"
              class="socialLinkIcon"
            />
          </a>
          <a href="https://x.com/luca_gloger" class="socialLink">
            <img
              src="assets/icons/twitter.svg"
              alt="twitter"
              class="socialLinkIcon"
            />
          </a>
          <a href="https://www.instagram.com/luca.gloger1/" class="socialLink">
            <img
              src="assets/icons/instagram.svg"
              alt="instagram"
              class="socialLinkIcon"
            />
          </a>
        </div>
      </div>

    document.getElementById("copyrightYear").textContent =
